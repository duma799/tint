name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Smoke test the command
        run: |
          .build/debug/tint --version
          .build/debug/tint palette assets/icon.png
          .build/debug/tint apply assets/icon.png --no-reload
          .build/debug/tint wallpaper -v || true
          .build/debug/tint doctor || true

  # The core (colour maths, output, store parsing…) has no macOS calls in
  # its tests, so they run on Linux too.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - run: swift test

  # Opens the real app on a real wallpaper and takes a picture of it
  # (attached to the run as "screenshot").
  screenshot:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - run: swift build --product TintApp

      - name: Screenshot
        run: |
          curl -sSfL -o "$RUNNER_TEMP/koi.jpg" https://raw.githubusercontent.com/duma799/yabai-config/main/backgrounds/koi.jpg
          TINT_APP_IMAGE="$RUNNER_TEMP/koi.jpg" .build/debug/TintApp &
          sleep 12
          screencapture -x "$RUNNER_TEMP/screen.png"
          kill %1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: ${{ runner.temp }}/screen.png
